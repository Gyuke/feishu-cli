options:
  debounce: 10s            # 同一文档两次定向重导的最小间隔（watch 用）
  download_images: true    # 拉取时下载图片到 assets_dir
  clean: true             # 是否严格镜像：云端删了本地是否也删（reconcile 用；false=保留+索引标 gone）
  continue_on_error: true  # 单个节点失败是否继续
  include_types: [docx, sheet]

